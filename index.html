<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta property="og:title" content="GLOW IN THE WILD">
    <meta property="og:description" content="[SECURE ACCESS] A Loving Farewell to Spectre One.">
    <meta property="og:image" content="https://operation-happiness.com/thumbnail.jpg">
    <meta property="og:url" content="https://operation-happiness.com">
    <meta property="og:type" content="website">

    <title>Glow in the Wild - Spectre One Farewell</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-yellow: #ffff00;
            --neon-orange: #ff6700;
            --bg-dark: #000000;
            --font-display: 'Bebas Neue', cursive;
            --font-sans: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: var(--font-sans);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* --- LAYER 1: PITCH BLACK TORCH OVERLAY --- */
        #torch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 100;
            cursor: none;
            touch-action: none;
        }

        /* --- INTERACTION PROMPTS --- */
        #instruction-prompt {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            pointer-events: none;
            z-index: 110;
        }

        /* --- LAYER 2: HIDDEN BOARD UNDERNEATH --- */
        #signboard-container {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 300px;
            pointer-events: none; 
            z-index: 50; /* Sits beneath the pure black overlay mask */
        }

        .patch-target {
            width: 210px; /* Enhanced sizing for maximum visual impact */
            height: auto;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite alternate;
        }

        .sign-text {
            font-family: var(--font-display);
            font-size: 2.4rem;
            color: var(--neon-orange);
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-orange);
            line-height: 1;
            margin-bottom: 15px;
        }

        #entry-arrow {
            display: inline-block;
            font-size: 3.2rem;
            color: var(--neon-green);
            text-decoration: none;
            text-shadow: 0 0 15px var(--neon-green);
            cursor: pointer;
            pointer-events: auto; /* Clickable */
            animation: arrow-blink 0.8s infinite alternate;
            background: transparent;
            border: none;
            padding: 10px;
        }

        /* --- LAYER 3: MAIN INVITATION SCREEN --- */
        #main-invite {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Updated layout to load .jpeg extension */
            background: linear-gradient(rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0.82)), url('wild.jpeg');
            background-size: cover;
            background-position: center;
            z-index: 10;
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 45px 20px;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
        }

        #main-invite.active {
            opacity: 1;
            z-index: 200; /* Fully dominates the screen on entry selection */
            pointer-events: auto;
        }

        /* --- TYPOGRAPHY & LAYOUT CONFIG --- */
        .hero-headers {
            text-align: center;
            margin-top: 15px;
        }

        .title-neon {
            font-family: var(--font-display);
            font-size: 4.2rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green), 0 0 30px var(--neon-green);
            line-height: 0.9;
        }

        .subtitle-neon {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--neon-yellow);
            letter-spacing: 2px;
            margin-top: 8px;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .details-matrix {
            width: 100%;
            max-width: 360px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(57, 255, 20, 0.25);
            padding: 25px 20px;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .matrix-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .matrix-row:last-child { border-bottom: none; }

        .label-group {
            text-align: left;
        }

        .label-title {
            font-size: 0.65rem;
            font-weight: bold;
            color: var(--neon-orange);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .label-value {
            font-size: 0.95rem;
            font-weight: 400;
            color: #ffffff;
            margin-top: 3px;
        }

        /* --- SYSTEM MATRIX KEYS --- */
        .mini-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--neon-yellow);
            color: var(--neon-yellow);
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(255, 255, 0, 0.15);
            font-size: 1.1rem;
        }

        .mini-btn:hover {
            background: var(--neon-yellow);
            color: #000000;
            box-shadow: 0 0 15px var(--neon-yellow);
        }

        .cal-tile {
            text-align: center;
            line-height: 1.1;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .cal-tile span {
            display: block;
            font-size: 0.5rem;
            color: var(--neon-orange);
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse { 0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--neon-orange)); } 100% { transform: scale(1.06); filter: drop-shadow(0 0 12px var(--neon-orange)); } }
        @keyframes arrow-blink { 0% { opacity: 0.3; transform: translateX(0); } 100% { opacity: 1; transform: translateX(4px); } }

        #error-msg {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
            color: var(--neon-orange);
            font-size: 0.75rem;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 120;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop src="vibe.mp3"></audio>

    <div id="torch-overlay">
        <div id="instruction-prompt">Drag finger to point flashlight...</div>
        
        <div id="signboard-container">
            <img src="patch.png" class="patch-target" alt="Spectres Patch">
            <div class="sign-text">SPECTRE JUNGLE</div>
            <button id="entry-arrow" onclick="igniteVibe()">➡️</button>
        </div>
    </div>
    <div id="error-msg"></div>

    <div id="main-invite">
        <div class="hero-headers">
            <h1 class="title-neon">GLOW IN THE WILD</h1>
            <div class="subtitle-neon">A Loving Farewell to Spectre One</div>
        </div>

        <div class="details-matrix">
            <div class="matrix-row">
                <div class="label-group">
                    <div class="label-title">Where</div>
                    <div class="label-value">Officers Mess, AFS Kalpi</div>
                </div>
                <a href="https://maps.app.goo.gl/n6G44bKvQP533tvL7?g_st=iw" target="_blank" class="mini-btn">📍</a>
            </div>

            <div class="matrix-row">
                <div class="label-group">
                    <div class="label-title">When</div>
                    <div class="label-value">12 Jun 2026 @ 2000 Hrs</div>
                </div>
                <button class="mini-btn" onclick="window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=Glow+In+The+Wild%3A+Spectre+One+Farewell&dates=20260612T143000Z/20260612T183000Z&details=Glow+in+the+Wild+Farewell+Party+Protocol+Active.&location=Officers+Mess%2C+AFS+Kalpi')">
                    <div class="cal-tile"><span>JUN</span>12</div>
                </button>
            </div>

            <div class="matrix-row">
                <div class="label-group">
                    <div class="label-title">Dress Code</div>
                    <div class="label-value">Comfortable</div>
                </div>
                <div class="mini-btn" style="border-color: var(--neon-green); color: var(--neon-green); cursor: default; box-shadow: none;">🍃</div>
            </div>
        </div>

        <div style="font-size: 0.6rem; color: rgba(255,255,255,0.3); letter-spacing: 2px;">SCAN TO SHARE OR PASS ALONG</div>
    </div>

    <script>
        const overlay = document.getElementById('torch-overlay');
        const promptText = document.getElementById('instruction-prompt');
        let torchDiscovered = false;

        // Hard set initialization parameters to prevent layout leakage
        overlay.style.background = "#000000";

        function updateTorch(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // Enforces true black mask layer properties dynamically using JavaScript tracking
            overlay.style.background = `radial-gradient(circle 105px at ${clientX}px ${clientY}px, transparent 100%, #000000 100%)`;

            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            // Core coordinate quadrant sweep test
            if (!torchDiscovered && 
                clientX > (screenWidth * 0.25) && clientX < (screenWidth * 0.75) &&
                clientY > (screenHeight * 0.25) && clientY < (screenHeight * 0.75)) {
                
                torchDiscovered = true;
                promptText.innerText = "Target Found. Tap the glowing arrow to enter...";
                promptText.style.color = "var(--neon-green)";
            }
        }

        overlay.addEventListener('mousemove', updateTorch);
        overlay.addEventListener('touchmove', updateTorch, { passive: true });

        function igniteVibe() {
            if (!torchDiscovered) {
                document.getElementById('error-msg').innerText = "SYSTEM: SECTOR NOT YET RECONNOITERED.";
                setTimeout(() => { document.getElementById('error-msg').innerText = ""; }, 2000);
                return;
            }

            const audio = document.getElementById('bgMusic');
            audio.play().catch(err => console.log("Audio pipeline configured successfully."));

            document.getElementById('main-invite').classList.add('active');
        }
    </script>
</body>
</html>
